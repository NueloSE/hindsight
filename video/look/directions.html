<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../assets/fonts/fonts.css" />
<script src="../assets/data.js"></script>
<style>
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; }
  canvas { position: absolute; inset: 0; }
  .title { position: absolute; left: 0; right: 0; top: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .row { display: flex; align-items: center; gap: 34px; }
  .name { font-family: "Newsreader"; font-weight: 500; font-size: 176px; letter-spacing: -4px; line-height: 1; }
  .tag { margin-top: 26px; font-family: "Newsreader"; font-style: italic; font-size: 54px; }
  .mark { background-image: linear-gradient(transparent 60%, rgba(243, 211, 107, 0.75) 60%); padding: 0 10px; }
  .kicker { position: absolute; left: 96px; bottom: 80px; font: 400 26px "Geist Mono"; letter-spacing: 1px; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<div class="title">
  <div class="row">
    <svg width="150" height="150" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#1F1C17"/><rect x="13" y="40" width="38" height="11" rx="2.5" fill="#F3D36B" opacity="0.9"/><path d="M23 13v33M23 32c0-6.5 4.2-10 9.2-10S41 25.5 41 32v14" fill="none" stroke="#F6F3EE" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div class="name">Hindsight</div>
  </div>
  <div class="tag"><span class="mark">Your trades, reviewed.</span></div>
</div>
<div class="kicker" id="kicker"></div>
<script>
const D = new URLSearchParams(location.search).get("d") || "A";
const c = document.getElementById("c"), g = c.getContext("2d");
const W = 1920, H = 1080;
// Seeded hash for deterministic "randomness".
const rnd = (i) => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const ink = "#1F1C17", paper = "#F6F3EE";

function journal() {
  // A: trading journal. Ledger ruling, a red margin, handwritten-like trade rows fading to the edges,
  // and highlighter sweeps across rows that were habits.
  document.body.style.background = paper;
  g.fillStyle = paper; g.fillRect(0, 0, W, H);
  const rows = DATA.trades.slice(-26);
  for (let y = 70, i = 0; y < H; y += 40, i++) {
    g.strokeStyle = "rgba(110, 140, 170, 0.22)"; g.lineWidth = 1.2;
    g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke();
    const tr = rows[i % rows.length];
    const fade = Math.min(1, Math.abs(y - H / 2) / 300);
    g.globalAlpha = 0.18 + 0.5 * fade;
    g.font = '400 20px "Geist Mono"'; g.fillStyle = ink;
    const d = new Date(tr.t).toISOString().slice(5, 16).replace("T", " ");
    const line = `#${String(tr.no).padStart(3, "0")}  ${d}  r${tr.ticker.padEnd(5)}  ${tr.session.padEnd(9)}  ${(tr.ret * 100).toFixed(2).padStart(6)}%`;
    g.fillText(line, 190, y - 11);
    g.fillText(line.split("").reverse().join("").slice(0, 0), 0, 0);
    if (tr.closed && rnd(i) > 0.45 && fade > 0.5) { g.globalAlpha = 0.45 * fade; g.fillStyle = "#F3D36B"; g.fillRect(186, y - 30, 560 + rnd(i + 9) * 120, 22); }
    g.globalAlpha = 1;
  }
  g.strokeStyle = "rgba(190, 70, 60, 0.45)"; g.lineWidth = 2; g.beginPath(); g.moveTo(150, 0); g.lineTo(150, H); g.stroke();
  // soft paper vignette keeps the centre quiet
  const v = g.createRadialGradient(W / 2, H / 2, 200, W / 2, H / 2, 900); v.addColorStop(0, "rgba(246,243,238,0.97)"); v.addColorStop(1, "rgba(246,243,238,0)");
  g.fillStyle = v; g.fillRect(0, 0, W, H);
  document.querySelector(".name").style.color = ink; document.querySelector(".tag").style.color = ink;
  document.getElementById("kicker").textContent = "A · THE TRADING JOURNAL — ledger ruling + highlighter";
  document.getElementById("kicker").style.color = "#6E675C";
}

function dial() {
  // B: the 24/7 market clock. Seven concentric day-rings, 24 hours around; regular US hours glow amber,
  // closed hours stay dark; the weekend rings are dim. A playhead sweeps backwards.
  document.body.style.background = "#15130F";
  g.fillStyle = "#15130F"; g.fillRect(0, 0, W, H);
  const cx = W / 2, cy = H / 2;
  for (let day = 0; day < 7; day++) {
    const r = 330 + day * 62;
    for (let h = 0; h < 24; h++) {
      const a0 = (h / 24) * Math.PI * 2 - Math.PI / 2, a1 = ((h + 0.86) / 24) * Math.PI * 2 - Math.PI / 2;
      const weekend = day >= 5;
      const regular = !weekend && h >= 13.5 && h < 20; // UTC 13:30–20:00
      const ext = !weekend && ((h >= 8 && h < 13.5) || (h >= 20 && h < 24));
      g.strokeStyle = regular ? "rgba(243, 211, 107, 0.85)" : ext ? "rgba(224, 138, 78, 0.38)" : weekend ? "rgba(237, 231, 220, 0.07)" : "rgba(237, 231, 220, 0.14)";
      g.lineWidth = 26; g.beginPath(); g.arc(cx, cy, r, a0, a1); g.stroke();
    }
  }
  // rewind playhead with fading trail
  for (let k = 0; k < 40; k++) {
    const a = -Math.PI / 2 + 2.2 - k * 0.012;
    g.strokeStyle = `rgba(237, 231, 220, ${0.5 * (1 - k / 40)})`; g.lineWidth = 2;
    g.beginPath(); g.moveTo(cx + Math.cos(a) * 300, cy + Math.sin(a) * 300); g.lineTo(cx + Math.cos(a) * 760, cy + Math.sin(a) * 760); g.stroke();
  }
  const v = g.createRadialGradient(cx, cy, 120, cx, cy, 420); v.addColorStop(0, "rgba(21,19,15,1)"); v.addColorStop(1, "rgba(21,19,15,0)");
  g.fillStyle = v; g.fillRect(0, 0, W, H);
  document.querySelector(".name").style.color = "#EDE7DC"; document.querySelector(".tag").style.color = "#EDE7DC";
  document.querySelector(".name").style.fontSize = "132px"; document.querySelector(".tag").style.fontSize = "42px";
  document.querySelector(".row svg").setAttribute("width", "112"); document.querySelector(".row svg").setAttribute("height", "112");
  document.getElementById("kicker").textContent = "B · THE 24/7 MARKET CLOCK — session rings, rewinding playhead";
  document.getElementById("kicker").style.color = "#A39B8D";
}

function tape() {
  // C: the replay tape. Real rNVDA hourly prices drawn as a long trace, US-closed hours as vertical bands,
  // Tolu's trades as marker dots, and the trace ghosting backwards as if rewound.
  document.body.style.background = paper;
  g.fillStyle = paper; g.fillRect(0, 0, W, H);
  const pts = DATA.nvda;
  const lo = Math.min(...pts.map((p) => p[1])), hi = Math.max(...pts.map((p) => p[1]));
  const x = (i) => (i / (pts.length - 1)) * W;
  const y = (v) => H * 0.86 - ((v - lo) / (hi - lo)) * H * 0.72;
  pts.forEach((p, i) => { if (p[2]) { g.fillStyle = "rgba(228, 221, 209, 0.55)"; g.fillRect(x(i), 0, W / pts.length + 0.6, H); } });
  for (let echo = 4; echo >= 0; echo--) {
    g.strokeStyle = echo ? `rgba(31, 28, 23, ${0.06 + 0.04 * (4 - echo)})` : ink;
    g.lineWidth = echo ? 1 : 2.4; g.beginPath();
    pts.forEach((p, i) => { const xx = x(i) + echo * 26; i ? g.lineTo(xx, y(p[1])) : g.moveTo(xx, y(p[1])); });
    g.stroke();
  }
  const nvTrades = DATA.trades.filter((t) => t.ticker === "NVDA");
  nvTrades.forEach((t) => {
    const i = pts.findIndex((p) => p[0] >= t.t); if (i < 0) return;
    g.fillStyle = "rgba(243, 211, 107, 0.9)"; g.beginPath(); g.arc(x(i), y(pts[i][1]), 9, 0, Math.PI * 2); g.fill();
    g.strokeStyle = ink; g.lineWidth = 1.5; g.stroke();
  });
  const v = g.createRadialGradient(W / 2, H / 2, 160, W / 2, H / 2, 760); v.addColorStop(0, "rgba(246,243,238,0.96)"); v.addColorStop(1, "rgba(246,243,238,0)");
  g.fillStyle = v; g.fillRect(0, 0, W, H);
  document.querySelector(".name").style.color = ink; document.querySelector(".tag").style.color = ink;
  document.getElementById("kicker").textContent = "C · THE REPLAY TAPE — real rNVDA prices, closed-market bands, rewinding";
  document.getElementById("kicker").style.color = "#6E675C";
}

document.fonts.ready.then(() => ({ A: journal, B: dial, C: tape })[D]());
</script>
</body>
</html>
